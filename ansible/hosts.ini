[dispatch_servers]
target-node-01 ansible_host=127.0.0.1 ansible_connection=local

[dispatch_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_name=ambulance-dispatch-dashboard
app_user=dispatchsvc
app_group=dispatchsvc
app_dir=/opt/ambulance-dispatch
app_port=8080
java_package=openjdk-21-jre-headless
