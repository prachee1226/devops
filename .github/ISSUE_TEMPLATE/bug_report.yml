name: Bug Report
description: File a bug report for the Ambulance Dispatch Dashboard
title: "[BUG] <Brief summary of defect>"
labels: ["bug", "triage"]
assignees: ["prachee-wakode"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in SmartDispatch 108.
  - type: input
    id: environment
    attributes:
      label: Deployment Environment
      description: Where did this occur? (e.g. Local Dev, Jenkins Staging, Docker Container, Production)
      placeholder: "e.g. Docker Container port 8080"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed reproduction steps
      placeholder: |
        1. Open dashboard at http://localhost:8080
        2. Click 'Register & Dispatch Call' with empty phone number
        3. Observe unhandled exception
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
