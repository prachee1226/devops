name: SmartDispatch 108 CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Unit Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Compile and Run Unit & Integration Tests
        run: ./mvnw clean test

      - name: Package Executable JAR
        run: ./mvnw package -DskipTests=true

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

      - name: Archive Production JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ambulance-dispatch-dashboard-jar
          path: target/*.jar
